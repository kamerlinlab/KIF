name: Deploy docs
on:
  push:
    branches:
      - main
  pull_request: # TODO - temporary test to validate works before merging to main
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the dev deps
        run: uv sync --locked --dev

      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --force
